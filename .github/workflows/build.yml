name: Build Magisk Debug APK

on:
  push:
    branches: [ master ]
    paths:
      - "app/**"
      - "native/**"
      - "build.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ master ]
  workflow_dispatch:      # 允许手动触发

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: macos-15      # 保持原构建环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true   # 原工作流中 build job 使用的参数

      - name: Build debug APK
        run: ./build.py -v all   # 只构建 debug 版本

      - name: Stop Gradle daemon
        run: ./app/gradlew --stop

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: magisk-debug-${{ github.sha }}
          path: out               # 构建输出目录
          compression-level: 9